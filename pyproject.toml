[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "go2tpms"
version = "0.1.0"
description = "Unitree Go2 with compliant TPMS feet, trained with RL in MuJoCo (reproduction of Lee et al. 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.15.0",
    "numpy>=1.26",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
# CPU training with Stable-Baselines3 (versions tested on Windows, Python 3.11)
train = [
    "stable-baselines3==2.9.0",
    "torch>=2.0",
    "tensorboard",
    "tqdm",
    "rich",
]
# GPU training with MJX + Brax PPO. brax 0.14.2 needs jax.device_put_replicated,
# which jax 0.10 removed, so jax is pinned to 0.9.2 (+ the flax that matches it).
# On a GPU machine also install "jax[cuda12]==0.9.2".
mjx = [
    "mujoco-mjx==3.15.0",
    "jax==0.9.2",
    "jaxlib==0.9.2",
    "flax==0.12.6",
    "brax==0.14.2",
    "playground==0.2.0",
    "tensorboardX",
]
# Plots of the energy study (scripts/sweep.py)
plot = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["go2tpms"]
